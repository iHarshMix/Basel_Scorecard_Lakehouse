[project]
name = "basel-scorecard-lakehouse"
version = "1.0.0"
description = "Enterprise Credit Risk Lakehouse & Basel Scorecard Engine on LendingClub Data"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Harsh Yadav", email = "harsh@example.com" }
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "shap>=0.43.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "mlflow>=2.10.0",
    "pyarrow>=14.0.0",
    "dbt-core>=1.7.0",
    "dbt-databricks>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.4.0",
    "kaggle>=1.6.0",
]

[project.scripts]
download-data = "basel_scorecard_lakehouse.data_downloader:main"
run-local-demo = "basel_scorecard_lakehouse.run_local_demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
